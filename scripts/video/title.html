<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Windows 95 video cards</title>
<style>
@font-face { font-family: Win95; src: url('../../src/renderer/src/assets/system/ms-sans-serif-8.ttf'); }
@font-face { font-family: Win95Bold; src: url('../../src/renderer/src/assets/system/ms-sans-serif-8-bold.ttf'); }
html, body { margin: 0; overflow: hidden; background: #008080; }
canvas { width: 1920px; height: 1080px; image-rendering: pixelated; }
</style></head>
<body><canvas id="frame" width="960" height="540"></canvas>
<script>
const frame = document.getElementById('frame')
const context = frame.getContext('2d')
context.imageSmoothingEnabled = false
window.ready = document.fonts.load('11px Win95').then(() => document.fonts.load('11px Win95Bold'))
function pixelText(text, x, y, scale, color, bold = false) {
  const small = document.createElement('canvas')
  const paint = small.getContext('2d')
  paint.font = `11px ${bold ? 'Win95Bold' : 'Win95'}`
  small.width = Math.ceil(paint.measureText(text).width) + 2
  small.height = 16
  paint.font = `11px ${bold ? 'Win95Bold' : 'Win95'}`
  paint.fillStyle = color
  paint.textBaseline = 'top'
  paint.fillText(text, 0, 0)
  context.drawImage(small, Math.round(x - small.width * scale / 2), y, small.width * scale, 16 * scale)
}
window.drawCard = async (title, subtitle, index) => {
  await window.ready
  context.fillStyle = '#008080'
  context.fillRect(0, 0, 960, 540)
  if (index < 10) {
    const progress = (index + 1) / 10
    const width = Math.round(80 + 564 * progress)
    const height = Math.round(18 + 132 * progress)
    context.strokeStyle = '#c0c0c0'
    context.strokeRect(Math.round((960 - width) / 2), Math.round((540 - height) / 2), width, height)
    return
  }
  const x = 158, y = 195, w = 644, h = 150
  context.fillStyle = '#000000'; context.fillRect(x, y, w, h)
  context.fillStyle = '#ffffff'; context.fillRect(x, y, w - 1, h - 1)
  context.fillStyle = '#808080'; context.fillRect(x + 1, y + 1, w - 3, h - 3)
  context.fillStyle = '#c0c0c0'; context.fillRect(x + 2, y + 2, w - 5, h - 5)
  context.fillStyle = '#000080'; context.fillRect(x + 4, y + 4, w - 10, 18)
  context.font = '11px Win95Bold'; context.textBaseline = 'top'; context.fillStyle = '#ffffff'
  context.fillText('Windows 95', x + 8, y + 7)
  pixelText(title, 480, y + 45, title.length > 21 ? 2 : 3, '#000000', true)
  pixelText(subtitle, 480, y + 106, 1, '#000000')
}
window.drawContactSheet = async (images) => {
  frame.width = 1920
  frame.height = Math.ceil(images.length / 8) * 157
  frame.style.width = '1920px'
  frame.style.height = `${frame.height}px`
  context.imageSmoothingEnabled = false
  context.fillStyle = '#c0c0c0'
  context.fillRect(0, 0, frame.width, frame.height)
  context.font = '14px monospace'
  for (let i = 0; i < images.length; i++) {
    const image = new Image()
    image.src = images[i]
    await image.decode()
    const x = i % 8 * 240, y = Math.floor(i / 8) * 157
    context.drawImage(image, x, y, 240, 135)
    context.fillStyle = '#000000'
    context.fillText(`${String(Math.floor(i / 60)).padStart(2,'0')}:${String(i % 60).padStart(2,'0')}`, x + 7, y + 151)
  }
  return frame.height
}
</script></body></html>
